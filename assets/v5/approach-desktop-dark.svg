  <text x="1042" y="48" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="17" fill="#9AA1B0" text-anchor="middle" letter-spacing="2">05</text>
  <text x="1042" y="178" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#F1EEE6" font-weight="700" text-anchor="middle">Observe &amp; Improve</text>
  <text x="1042" y="208" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#9AA1B0" text-anchor="middle">Measure real</text>
  <text x="1042" y="232" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#9AA1B0" text-anchor="middle">operation and</text>
  <text x="1042" y="256" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#9AA1B0" text-anchor="middle">iterate.</text>
