  <text x="138" y="108" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#16181D" font-weight="700">Architecture</text>
  <text x="138" y="142" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#5C6270">Define the system before scaling it.</text>
