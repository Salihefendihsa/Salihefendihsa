<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="t d">
  <title id="t">Engineering approach — five stages from architecture to observation</title>
  <desc id="d">Engineering approach in five stages: Architecture — Define the system before scaling it.; Typed Boundaries — Make responsibilities and contracts explicit.; Testable Workflows — Prove behaviour before widening scope.; Human Approval — Keep consequential AI actions supervised.; Observe &amp; Improve — Measure real operation and iterate.</desc>
