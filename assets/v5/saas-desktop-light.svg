  <title id="t">SaaS products — Nilüfer İlaçlama, Barkod Sistemi, Calvelia, Kuyumcu Takip, Kalemlik, Kasabil</title>
  <desc id="d">SaaS products: Nilüfer İlaçlama — Field-service ops: Customers, crews, contracts and payments for a pest-control company. (Live Site); Barkod Sistemi — Retail stock &amp; POS: Barcode-driven stock, sales and till for retail shops. (Pilot); Calvelia — AI wardrobe: A digital wardrobe that suggests daily outfits from your own clothes. (Invite Pilot); Kuyumcu Takip — Jeweller operations: Live gold prices, stock and sales in one screen for jewellers. (In Build); Kalemlik — Stationery retail: Stock, barcode sales and customer accounts for stationery shops. (Pilot Shop); Kasabil — Restaurant POS: QR menu, orders, kitchen screen and till for restaurants and cafés. (In Build)</desc>
  <style>@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}.draw{stroke-dasharray:1200;animation:draw 1.6s ease-out .5s both}.fade{opacity:0;animation:rise 1s ease-out forwards}.trace{stroke-dasharray:100;animation:trace 1.4s ease-out .35s both}@keyframes trace{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{from{opacity:.35}to{opacity:1}}@keyframes ping{from{transform:scale(1);opacity:.5}to{transform:scale(2.2);opacity:0}}@keyframes travel{from{transform:translate(0,0)}to{transform:translate(var(--dx,0px),var(--dy,0px))}}.flow{stroke-dasharray:6 6;animation:flow 1.8s linear infinite}.spin{transform-box:view-box;animation:spin 18s linear infinite}.breathe{animation:breathe 2.8s ease-in-out infinite alternate}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}.travel{animation:travel 7s ease-in-out infinite alternate}@media (prefers-reduced-motion:reduce){.rise,.fade{opacity:1;animation:none}.draw,.trace,.flow,.spin,.breathe,.ping,.travel{animation:none}.draw,.trace{stroke-dasharray:none}}</style>
