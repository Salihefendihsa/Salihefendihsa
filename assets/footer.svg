<svg viewBox="0 0 1200 230" width="1200" height="230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="footer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#090C12"/></linearGradient>
    <linearGradient id="facc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F6FEB"/><stop offset="0.5" stop-color="#7C5CFF"/><stop offset="1" stop-color="#A371F7"/></linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="1.1" r="0.7"><stop offset="0" stop-color="#7C5CFF" stop-opacity="0.32"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
    <pattern id="fdots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#1B2330"/></pattern>
