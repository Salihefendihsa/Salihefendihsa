  <text x="600" y="128" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Consolas,monospace" font-size="16" fill="#8B949E">Open to collaborations, ideas, and good problems to solve.</text>
  <text x="600" y="166" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Consolas,monospace" font-size="15" fill="#A371F7">&gt; still shipping<tspan>_<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
