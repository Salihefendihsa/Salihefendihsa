<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240" role="img" aria-label="Friendly AI workshop assistant mascot">
  <title>AI workshop assistant</title>
  <defs>
    <linearGradient id="mas-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B1F7A"/>
      <stop offset="1" stop-color="#1B1036"/>
    </linearGradient>
    <linearGradient id="mas-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1656"/>
      <stop offset="1" stop-color="#150C2B"/>
    </linearGradient>
    <linearGradient id="mas-visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0716"/>
      <stop offset="1" stop-color="#140B2E"/>
    </linearGradient>
    <radialGradient id="mas-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="mas-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mas-softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mas-float { animation: mas-float 5s ease-in-out infinite; }
      .mas-blink { animation: mas-blink 1.4s steps(2, start) infinite; }
      .mas-pulse { animation: mas-pulse 3s ease-in-out infinite; }
      .mas-shadow { animation: mas-shadow 5s ease-in-out infinite; transform-origin: 100px 222px; }
      @keyframes mas-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes mas-blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes mas-pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes mas-shadow { 0%,100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(0.85); opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) {
        .mas-float, .mas-blink, .mas-pulse, .mas-shadow { animation: none; }
      }
    </style>
  </defs>

  <!-- hover shadow -->
  <ellipse class="mas-shadow" cx="100" cy="222" rx="42" ry="7" fill="url(#mas-halo)"/>

  <g class="mas-float">
    <!-- antenna -->
    <line x1="100" y1="42" x2="100" y2="24" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
    <circle class="mas-pulse" cx="100" cy="20" r="5" fill="#FBBF24" filter="url(#mas-glow)"/>

    <!-- side lights -->
    <rect x="46" y="72" width="10" height="24" rx="5" fill="#22D3EE" opacity="0.9" filter="url(#mas-softglow)"/>
    <rect x="144" y="72" width="10" height="24" rx="5" fill="#22D3EE" opacity="0.9" filter="url(#mas-softglow)"/>

    <!-- head -->
    <rect x="56" y="42" width="88" height="84" rx="24" fill="url(#mas-head)" stroke="#7C3AED" stroke-width="2"/>
    <!-- visor -->
    <rect x="70" y="60" width="60" height="44" rx="12" fill="url(#mas-visor)" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
    <!-- terminal eyes: >_ -->
    <text x="82" y="90" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="24" font-weight="700" fill="#22D3EE" filter="url(#mas-softglow)">&gt;</text>
    <rect class="mas-blink" x="102" y="86" width="14" height="4" rx="1" fill="#E040FB" filter="url(#mas-softglow)"/>
    <!-- cheek highlight -->
    <circle cx="66" cy="112" r="3" fill="#E040FB" opacity="0.55"/>
    <circle cx="134" cy="112" r="3" fill="#E040FB" opacity="0.55"/>

    <!-- neck -->
    <rect x="90" y="126" width="20" height="8" rx="3" fill="#3B1F7A"/>

    <!-- body -->
    <rect x="66" y="134" width="68" height="62" rx="20" fill="url(#mas-body)" stroke="#7C3AED" stroke-width="2"/>
    <!-- chest core -->
    <circle class="mas-pulse" cx="100" cy="160" r="9" fill="#0B0716" stroke="#22D3EE" stroke-width="2"/>
    <circle class="mas-pulse" cx="100" cy="160" r="4" fill="#22D3EE" filter="url(#mas-glow)"/>
    <!-- chest slit -->
    <rect x="86" y="178" width="28" height="3" rx="1.5" fill="#8B5CF6" opacity="0.7"/>

    <!-- arms -->
    <rect x="44" y="140" width="18" height="40" rx="9" fill="#2A1656" stroke="#7C3AED" stroke-width="2"/>
    <rect x="138" y="140" width="18" height="40" rx="9" fill="#2A1656" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="53" cy="180" r="6" fill="#22D3EE" opacity="0.8"/>
    <circle cx="147" cy="180" r="6" fill="#22D3EE" opacity="0.8"/>
  </g>
</svg>
