<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="462" viewBox="0 0 1200 462" role="img" aria-label="Tech Universe — languages, frontend, backend, mobile, data, AI and automation, tools">
  <title>Tech Universe</title>
  <defs>
    <linearGradient id="tu-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0714"/>
      <stop offset="1" stop-color="#140B2E"/>
    </linearGradient>
    <linearGradient id="tu-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150C2B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0B0716" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tu-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#E040FB"/>
    </linearGradient>
    <radialGradient id="tu-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tu-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8B5CF6" stroke-opacity="0.08"/>
    </pattern>
    <filter id="tu-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tu-clip"><rect width="1200" height="462" rx="22"/></clipPath>
    <style>
      .tu-sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .tu-mono { font-family: Consolas, 'JetBrains Mono', Menlo, monospace; }
      .tu-orbit-a { animation: tu-spin 60s linear infinite; transform-origin: 600px 231px; }
      .tu-orbit-b { animation: tu-spin 90s linear infinite reverse; transform-origin: 600px 231px; }
      .tu-dot { animation: tu-pulse 2.6s ease-in-out infinite; }
      .tu-cursor { animation: tu-blink 1.1s steps(2, start) infinite; }
      @keyframes tu-spin { to { transform: rotate(360deg); } }
      @keyframes tu-pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes tu-blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .tu-orbit-a, .tu-orbit-b, .tu-dot, .tu-cursor { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#tu-clip)">
    <rect width="1200" height="462" fill="url(#tu-bg)"/>
    <rect width="1200" height="462" fill="url(#tu-grid)"/>
    <ellipse cx="600" cy="231" rx="520" ry="200" fill="url(#tu-core)"/>
    <!-- orbit rings -->
    <g fill="none" stroke-width="1">
      <ellipse class="tu-orbit-a" cx="600" cy="231" rx="560" ry="180" stroke="#8B5CF6" stroke-opacity="0.18" stroke-dasharray="6 14"/>
      <ellipse class="tu-orbit-b" cx="600" cy="231" rx="420" ry="120" stroke="#22D3EE" stroke-opacity="0.16" stroke-dasharray="3 12"/>
