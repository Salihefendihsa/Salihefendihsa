    <text x="96" y="41" class="tu-mono" font-size="13" fill="#22D3EE">$ <tspan fill="#C4B5FD">workshop</tspan> --list-tech<tspan class="tu-cursor" fill="#22D3EE"> ▍</tspan></text>
    <text x="1168" y="41" text-anchor="end" class="tu-mono" font-size="11" fill="#8B8AA8" letter-spacing="2">TECH UNIVERSE · 7 SECTORS</text>

