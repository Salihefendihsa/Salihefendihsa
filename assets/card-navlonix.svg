<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Navlonix — AI-powered logistics marketplace, in active development">
  <title>Navlonix</title>
  <defs>
    <linearGradient id="cn-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#150C2B"/>
      <stop offset="1" stop-color="#0B0716"/>
    </linearGradient>
    <linearGradient id="cn-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="cn-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cn-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#22D3EE" stroke-opacity="0.08"/>
    </pattern>
    <filter id="cn-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cn-clip"><rect width="1200" height="210" rx="20"/></clipPath>
    <style>
      .cn-sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .cn-mono { font-family: Consolas, 'JetBrains Mono', Menlo, monospace; }
      .cn-route { stroke-dasharray: 8 10; animation: cn-dash 3s linear infinite; }
      .cn-truck { animation: cn-move 9s ease-in-out infinite; }
      .cn-dot { animation: cn-pulse 2s ease-in-out infinite; }
      @keyframes cn-dash { to { stroke-dashoffset: -36; } }
      @keyframes cn-move { 0% { transform: translateX(0); } 50% { transform: translateX(210px); } 100% { transform: translateX(0); } }
      @keyframes cn-pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .cn-route, .cn-truck, .cn-dot { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#cn-clip)">
    <rect width="1200" height="210" fill="url(#cn-bg)"/>
    <rect width="1200" height="210" fill="url(#cn-grid)"/>
    <ellipse cx="980" cy="110" rx="300" ry="160" fill="url(#cn-halo)"/>
    <rect x="0" y="0" width="6" height="210" fill="url(#cn-accent)"/>

    <!-- index + tag -->
    <text x="44" y="46" class="cn-mono" font-size="12" fill="#22D3EE" letter-spacing="3">BUILD 01</text>
    <rect x="128" y="32" width="176" height="20" rx="10" fill="#0B0716" stroke="#FBBF24" stroke-opacity="0.7"/>
    <circle class="cn-dot" cx="141" cy="42" r="3.5" fill="#FBBF24" filter="url(#cn-glow)"/>
    <text x="151" y="46" class="cn-mono" font-size="10.5" fill="#FBBF24" letter-spacing="1">IN ACTIVE DEVELOPMENT</text>

    <!-- title + description -->
    <text x="44" y="92" class="cn-sans" font-size="34" font-weight="700" fill="#F5F3FF">Navlonix</text>
    <text x="44" y="122" class="cn-sans" font-size="16" fill="#C4B5FD">AI-powered logistics marketplace connecting shippers with trusted drivers.</text>
    <text x="44" y="150" class="cn-sans" font-size="14" fill="#8B8AA8">Role-based apps · escrow-backed payments · real-time chat and live tracking</text>

    <!-- stack chips -->
    <g class="cn-mono" font-size="11" fill="#22D3EE">
      <rect x="44" y="166" width="62" height="22" rx="11" fill="#0B0716" stroke="#22D3EE" stroke-opacity="0.5"/><text x="75" y="181" text-anchor="middle">.NET 9</text>
      <rect x="114" y="166" width="62" height="22" rx="11" fill="#0B0716" stroke="#22D3EE" stroke-opacity="0.5"/><text x="145" y="181" text-anchor="middle">React</text>
      <rect x="184" y="166" width="62" height="22" rx="11" fill="#0B0716" stroke="#22D3EE" stroke-opacity="0.5"/><text x="215" y="181" text-anchor="middle">Expo</text>
      <rect x="254" y="166" width="86" height="22" rx="11" fill="#0B0716" stroke="#22D3EE" stroke-opacity="0.5"/><text x="297" y="181" text-anchor="middle">PostgreSQL</text>
    </g>

    <!-- illustration: route map -->
    <g transform="translate(760 0)">
      <circle cx="90" cy="150" r="6" fill="#0B0716" stroke="#22D3EE" stroke-width="2"/>
      <circle cx="380" cy="60" r="6" fill="#0B0716" stroke="#E040FB" stroke-width="2"/>
      <circle cx="230" cy="110" r="4" fill="#8B5CF6"/>
      <path d="M90 150 C 160 150, 180 110, 230 110 S 320 60, 380 60" fill="none" stroke="#3B1F7A" stroke-width="6" stroke-linecap="round"/>
      <path class="cn-route" d="M90 150 C 160 150, 180 110, 230 110 S 320 60, 380 60" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" filter="url(#cn-glow)"/>
      <!-- truck -->
      <g class="cn-truck">
        <rect x="100" y="126" width="34" height="18" rx="3" fill="#8B5CF6"/>
        <rect x="134" y="132" width="14" height="12" rx="2" fill="#22D3EE"/>
        <circle cx="110" cy="146" r="4" fill="#0B0716" stroke="#C4B5FD" stroke-width="1.5"/>
        <circle cx="140" cy="146" r="4" fill="#0B0716" stroke="#C4B5FD" stroke-width="1.5"/>
      </g>
      <text x="90" y="176" text-anchor="middle" class="cn-mono" font-size="10" fill="#22D3EE" letter-spacing="1">SHIPPER</text>
      <text x="380" y="42" text-anchor="middle" class="cn-mono" font-size="10" fill="#E040FB" letter-spacing="1">DRIVER</text>
      <text x="230" y="98" text-anchor="middle" class="cn-mono" font-size="10" fill="#C4B5FD" letter-spacing="1">AI MATCH</text>
    </g>

    <!-- link hint -->
    <text x="1156" y="186" text-anchor="end" class="cn-mono" font-size="12" fill="#22D3EE">LIVE DEMO  →</text>
  </g>
</svg>
