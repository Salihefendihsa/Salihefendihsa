<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Hilmi Salih Altınışık — Software Engineer, AI Systems Builder, Product-Minded Entrepreneur">
  <title>Hilmi Salih Altınışık — Neon AI Workshop</title>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0714"/>
      <stop offset="0.55" stop-color="#0E0A1F"/>
      <stop offset="1" stop-color="#150C2B"/>
    </linearGradient>
    <radialGradient id="hero-glow-violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-glow-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-glow-magenta" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E040FB" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E040FB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="0.6" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="hero-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#E040FB" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="hero-mas-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B1F7A"/>
      <stop offset="1" stop-color="#1B1036"/>
    </linearGradient>
    <linearGradient id="hero-mas-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1656"/>
      <stop offset="1" stop-color="#150C2B"/>
    </linearGradient>
    <radialGradient id="hero-mas-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8B5CF6" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="hero-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hero-softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hero-clip"><rect width="1200" height="420" rx="24"/></clipPath>
    <style>
      .hero-sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .hero-mono { font-family: Consolas, 'JetBrains Mono', Menlo, monospace; }
      .hero-cursor { animation: hero-blink 1.1s steps(2, start) infinite; }
      .hero-dot { animation: hero-pulse 2.2s ease-in-out infinite; }
      .hero-p1 { animation: hero-drift 14s linear infinite; }
      .hero-p2 { animation: hero-drift 18s linear infinite; animation-delay: -6s; }
      .hero-p3 { animation: hero-drift 22s linear infinite; animation-delay: -11s; }
      .hero-node { animation: hero-pulse 4s ease-in-out infinite; }
      .hero-node-b { animation: hero-pulse 4s ease-in-out infinite; animation-delay: -2s; }
      .hero-float { animation: hero-float 5s ease-in-out infinite; }
      .hero-shadow { animation: hero-shadow 5s ease-in-out infinite; transform-origin: 100px 222px; }
      .hero-blinkslow { animation: hero-blink 1.4s steps(2, start) infinite; }
      .hero-pulse3 { animation: hero-pulse 3s ease-in-out infinite; }
      @keyframes hero-blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes hero-pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes hero-drift { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 0.9; } 90% { opacity: 0.6; } 100% { transform: translateY(-420px); opacity: 0; } }
      @keyframes hero-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes hero-shadow { 0%,100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(0.85); opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) {
        .hero-cursor, .hero-dot, .hero-p1, .hero-p2, .hero-p3, .hero-node, .hero-node-b, .hero-float, .hero-shadow, .hero-blinkslow, .hero-pulse3 { animation: none; }
        .hero-p1, .hero-p2, .hero-p3 { opacity: 0.5; }
      }
    </style>
  </defs>

  <g clip-path="url(#hero-clip)">
    <!-- background -->
    <rect width="1200" height="420" fill="url(#hero-bg)"/>
    <rect width="1200" height="420" fill="url(#hero-grid)"/>
    <ellipse cx="180" cy="120" rx="420" ry="260" fill="url(#hero-glow-violet)"/>
    <ellipse cx="1000" cy="300" rx="380" ry="240" fill="url(#hero-glow-cyan)"/>
    <ellipse cx="700" cy="420" rx="300" ry="160" fill="url(#hero-glow-magenta)"/>

    <!-- node network (right/back) -->
    <g stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1" fill="none">
      <path d="M720 90 L820 60 L900 110 L980 70 L1080 120 L1150 80"/>
      <path d="M820 60 L850 160 L900 110"/>
      <path d="M980 70 L1010 170 L1080 120"/>
      <path d="M850 160 L780 250 L720 90"/>
      <path d="M1010 170 L1120 230 L1150 80"/>
      <path d="M780 250 L860 330 L1010 170"/>
      <path d="M860 330 L1120 230"/>
      <path d="M720 90 L640 190 L780 250"/>
    </g>
    <g fill="#22D3EE">
      <circle class="hero-node" cx="720" cy="90" r="3"/>
      <circle class="hero-node-b" cx="820" cy="60" r="2.5"/>
      <circle class="hero-node" cx="900" cy="110" r="3"/>
      <circle class="hero-node-b" cx="980" cy="70" r="2.5"/>
      <circle class="hero-node" cx="1080" cy="120" r="3"/>
      <circle class="hero-node-b" cx="1150" cy="80" r="2.5"/>
      <circle class="hero-node-b" cx="850" cy="160" r="3"/>
      <circle class="hero-node" cx="1010" cy="170" r="3.5" fill="#E040FB"/>
      <circle class="hero-node-b" cx="780" cy="250" r="3"/>
      <circle class="hero-node" cx="1120" cy="230" r="2.5"/>
      <circle class="hero-node-b" cx="860" cy="330" r="3" fill="#FBBF24"/>
      <circle class="hero-node" cx="640" cy="190" r="2.5"/>
    </g>

    <!-- slow neon particles -->
    <g class="hero-p1" fill="#22D3EE">
      <circle cx="90" cy="400" r="1.6"/><circle cx="330" cy="430" r="1.2"/><circle cx="560" cy="410" r="1.8"/><circle cx="760" cy="440" r="1.3"/><circle cx="1010" cy="425" r="1.5"/>
    </g>
    <g class="hero-p2" fill="#8B5CF6">
      <circle cx="200" cy="420" r="1.4"/><circle cx="450" cy="445" r="1.7"/><circle cx="680" cy="415" r="1.2"/><circle cx="900" cy="435" r="1.6"/><circle cx="1140" cy="420" r="1.3"/>
    </g>
    <g class="hero-p3" fill="#E040FB">
      <circle cx="140" cy="440" r="1.2"/><circle cx="400" cy="415" r="1.4"/><circle cx="620" cy="450" r="1.1"/><circle cx="840" cy="420" r="1.5"/><circle cx="1080" cy="445" r="1.2"/>
    </g>

    <!-- terminal window frame (left) -->
    <rect x="48" y="60" width="640" height="300" rx="18" fill="#0B0716" fill-opacity="0.72" stroke="#7C3AED" stroke-opacity="0.45" stroke-width="1.2"/>
    <rect x="48" y="60" width="640" height="34" rx="18" fill="#150C2B" fill-opacity="0.9"/>
    <rect x="48" y="78" width="640" height="16" fill="#150C2B" fill-opacity="0.9"/>
    <circle cx="70" cy="77" r="5" fill="#E040FB" opacity="0.9"/>
    <circle cx="88" cy="77" r="5" fill="#FBBF24" opacity="0.9"/>
    <circle cx="106" cy="77" r="5" fill="#22D3EE" opacity="0.9"/>
    <text x="368" y="82" text-anchor="middle" class="hero-mono" font-size="12" fill="#A78BFA" opacity="0.85">~/workshop — session</text>

    <!-- prompt line -->
    <text x="76" y="128" class="hero-mono" font-size="14" fill="#22D3EE">$ <tspan fill="#C4B5FD">whoami</tspan></text>

    <!-- name -->
    <text x="76" y="182" class="hero-sans" font-size="46" font-weight="700" fill="url(#hero-name)" letter-spacing="-0.5">Hilmi Salih Altınışık</text>
    <rect x="76" y="198" width="180" height="3" rx="1.5" fill="url(#hero-line)"/>

    <!-- roles -->
    <text x="76" y="240" class="hero-mono" font-size="17" fill="#E9E5FF">
      <tspan fill="#22D3EE">›</tspan> Software Engineer
    </text>
    <text x="76" y="270" class="hero-mono" font-size="17" fill="#E9E5FF">
      <tspan fill="#8B5CF6">›</tspan> AI Systems Builder
    </text>
    <text x="76" y="300" class="hero-mono" font-size="17" fill="#E9E5FF">
      <tspan fill="#E040FB">›</tspan> Product-Minded Entrepreneur<tspan class="hero-cursor" fill="#22D3EE"> ▍</tspan>
    </text>

    <!-- status pill -->
    <rect x="76" y="322" width="196" height="26" rx="13" fill="#150C2B" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1"/>
    <circle class="hero-dot" cx="92" cy="335" r="4" fill="#22D3EE" filter="url(#hero-glow)"/>
    <text x="104" y="339" class="hero-mono" font-size="12" fill="#22D3EE" letter-spacing="1">SYSTEM: BUILDING</text>

    <text x="296" y="339" class="hero-mono" font-size="12" fill="#A78BFA" opacity="0.8">v2026.09 · neon-ai-workshop</text>

    <!-- mascot (right) -->
    <g transform="translate(905 52) scale(1.28)">
      <ellipse class="hero-shadow" cx="100" cy="222" rx="42" ry="7" fill="url(#hero-mas-halo)"/>
      <g class="hero-float">
        <line x1="100" y1="42" x2="100" y2="24" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
        <circle class="hero-pulse3" cx="100" cy="20" r="5" fill="#FBBF24" filter="url(#hero-glow)"/>
        <rect x="46" y="72" width="10" height="24" rx="5" fill="#22D3EE" opacity="0.9" filter="url(#hero-softglow)"/>
        <rect x="144" y="72" width="10" height="24" rx="5" fill="#22D3EE" opacity="0.9" filter="url(#hero-softglow)"/>
        <rect x="56" y="42" width="88" height="84" rx="24" fill="url(#hero-mas-head)" stroke="#7C3AED" stroke-width="2"/>
        <rect x="70" y="60" width="60" height="44" rx="12" fill="#0B0716" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
        <text x="82" y="90" class="hero-mono" font-size="24" font-weight="700" fill="#22D3EE" filter="url(#hero-softglow)">&gt;</text>
        <rect class="hero-blinkslow" x="102" y="86" width="14" height="4" rx="1" fill="#E040FB" filter="url(#hero-softglow)"/>
        <circle cx="66" cy="112" r="3" fill="#E040FB" opacity="0.55"/>
        <circle cx="134" cy="112" r="3" fill="#E040FB" opacity="0.55"/>
        <rect x="90" y="126" width="20" height="8" rx="3" fill="#3B1F7A"/>
        <rect x="66" y="134" width="68" height="62" rx="20" fill="url(#hero-mas-body)" stroke="#7C3AED" stroke-width="2"/>
        <circle class="hero-pulse3" cx="100" cy="160" r="9" fill="#0B0716" stroke="#22D3EE" stroke-width="2"/>
        <circle class="hero-pulse3" cx="100" cy="160" r="4" fill="#22D3EE" filter="url(#hero-glow)"/>
        <rect x="86" y="178" width="28" height="3" rx="1.5" fill="#8B5CF6" opacity="0.7"/>
        <rect x="44" y="140" width="18" height="40" rx="9" fill="#2A1656" stroke="#7C3AED" stroke-width="2"/>
        <rect x="138" y="140" width="18" height="40" rx="9" fill="#2A1656" stroke="#7C3AED" stroke-width="2"/>
        <circle cx="53" cy="180" r="6" fill="#22D3EE" opacity="0.8"/>
        <circle cx="147" cy="180" r="6" fill="#22D3EE" opacity="0.8"/>
      </g>
    </g>

    <!-- mascot label -->
    <rect x="928" y="352" width="146" height="24" rx="12" fill="#150C2B" stroke="#8B5CF6" stroke-opacity="0.5"/>
    <text x="1001" y="368" text-anchor="middle" class="hero-mono" font-size="11" fill="#C4B5FD" letter-spacing="1">WORKSHOP ASSISTANT</text>

    <!-- bottom accent line -->
    <rect x="0" y="417" width="1200" height="3" fill="url(#hero-line)" opacity="0.8"/>
  </g>
</svg>
