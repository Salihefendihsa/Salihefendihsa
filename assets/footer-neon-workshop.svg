<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Let's build something useful.">
  <title>Let's build something useful.</title>
  <defs>
    <linearGradient id="ft-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150C2B"/>
      <stop offset="0.6" stop-color="#0E0A1F"/>
      <stop offset="1" stop-color="#0A0714"/>
    </linearGradient>
    <linearGradient id="ft-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E040FB" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="ft-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="ft-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ft-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ft-mas-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B1F7A"/>
      <stop offset="1" stop-color="#1B1036"/>
    </linearGradient>
    <linearGradient id="ft-mas-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1656"/>
      <stop offset="1" stop-color="#150C2B"/>
    </linearGradient>
    <pattern id="ft-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8B5CF6" stroke-opacity="0.08"/>
    </pattern>
    <filter id="ft-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ft-clip"><rect width="1200" height="220" rx="24"/></clipPath>
    <style>
      .ft-sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .ft-mono { font-family: Consolas, 'JetBrains Mono', Menlo, monospace; }
      .ft-float { animation: ft-float 5s ease-in-out infinite; }
      .ft-wave { animation: ft-wave 4s ease-in-out infinite; transform-origin: 147px 144px; }
      .ft-blink { animation: ft-blink 1.4s steps(2, start) infinite; }
      .ft-pulse { animation: ft-pulse 3s ease-in-out infinite; }
      .ft-shadow { animation: ft-shadow 5s ease-in-out infinite; transform-origin: 100px 222px; }
      .ft-p { animation: ft-drift 16s linear infinite; }
      .ft-p2 { animation: ft-drift 20s linear infinite; animation-delay: -8s; }
      @keyframes ft-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes ft-wave { 0%,60%,100% { transform: rotate(0deg); } 70% { transform: rotate(-38deg); } 80% { transform: rotate(-18deg); } 90% { transform: rotate(-38deg); } }
      @keyframes ft-blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes ft-pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes ft-shadow { 0%,100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(0.85); opacity: 0.35; } }
      @keyframes ft-drift { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.5; } 100% { transform: translateY(-240px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .ft-float, .ft-wave, .ft-blink, .ft-pulse, .ft-shadow, .ft-p, .ft-p2 { animation: none; } .ft-p, .ft-p2 { opacity: 0.5; } }
    </style>
  </defs>
  <g clip-path="url(#ft-clip)">
    <rect width="1200" height="220" fill="url(#ft-bg)"/>
    <rect width="1200" height="220" fill="url(#ft-grid)"/>
    <ellipse cx="600" cy="110" rx="520" ry="200" fill="url(#ft-glow)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#ft-line)" opacity="0.9"/>

    <g class="ft-p" fill="#22D3EE"><circle cx="120" cy="230" r="1.5"/><circle cx="420" cy="240" r="1.2"/><circle cx="760" cy="228" r="1.6"/><circle cx="1040" cy="236" r="1.3"/></g>
    <g class="ft-p2" fill="#E040FB"><circle cx="260" cy="236" r="1.2"/><circle cx="600" cy="226" r="1.4"/><circle cx="900" cy="242" r="1.1"/><circle cx="1140" cy="230" r="1.3"/></g>

    <!-- mascot waving (left) -->
    <g transform="translate(60 8) scale(0.78)">
      <ellipse class="ft-shadow" cx="100" cy="222" rx="42" ry="7" fill="url(#ft-halo)"/>
      <g class="ft-float">
        <line x1="100" y1="42" x2="100" y2="24" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
        <circle class="ft-pulse" cx="100" cy="20" r="5" fill="#FBBF24" filter="url(#ft-soft)"/>
        <rect x="46" y="72" width="10" height="24" rx="5" fill="#22D3EE" opacity="0.9" filter="url(#ft-soft)"/>
        <rect x="144" y="72" width="10" height="24" rx="5" fill="#22D3EE" opacity="0.9" filter="url(#ft-soft)"/>
        <rect x="56" y="42" width="88" height="84" rx="24" fill="url(#ft-mas-head)" stroke="#7C3AED" stroke-width="2"/>
        <rect x="70" y="60" width="60" height="44" rx="12" fill="#0B0716" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
        <!-- happy eyes variant: ^ ^ -->
        <path d="M82 86 L90 78 L98 86" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#ft-soft)"/>
        <path d="M104 86 L112 78 L120 86" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#ft-soft)"/>
        <rect class="ft-blink" x="93" y="94" width="14" height="3" rx="1.5" fill="#E040FB" filter="url(#ft-soft)"/>
        <circle cx="66" cy="112" r="3" fill="#E040FB" opacity="0.55"/>
        <circle cx="134" cy="112" r="3" fill="#E040FB" opacity="0.55"/>
        <rect x="90" y="126" width="20" height="8" rx="3" fill="#3B1F7A"/>
        <rect x="66" y="134" width="68" height="62" rx="20" fill="url(#ft-mas-body)" stroke="#7C3AED" stroke-width="2"/>
        <circle class="ft-pulse" cx="100" cy="160" r="9" fill="#0B0716" stroke="#22D3EE" stroke-width="2"/>
        <circle class="ft-pulse" cx="100" cy="160" r="4" fill="#22D3EE" filter="url(#ft-soft)"/>
        <rect x="86" y="178" width="28" height="3" rx="1.5" fill="#8B5CF6" opacity="0.7"/>
        <!-- left arm (idle) -->
        <rect x="44" y="140" width="18" height="40" rx="9" fill="#2A1656" stroke="#7C3AED" stroke-width="2"/>
        <circle cx="53" cy="180" r="6" fill="#22D3EE" opacity="0.8"/>
        <!-- right arm (waves) -->
        <g class="ft-wave">
          <rect x="138" y="140" width="18" height="40" rx="9" fill="#2A1656" stroke="#7C3AED" stroke-width="2"/>
          <circle cx="147" cy="180" r="6" fill="#22D3EE" opacity="0.8"/>
        </g>
      </g>
    </g>

    <!-- message -->
    <text x="250" y="96" class="ft-mono" font-size="13" fill="#22D3EE">$ <tspan fill="#C4B5FD">echo</tspan> "<tspan fill="#FBBF24">next_build</tspan>"</text>
    <text x="250" y="140" class="ft-sans" font-size="38" font-weight="700" fill="url(#ft-text)" letter-spacing="-0.3">Let's build something useful.</text>
    <text x="250" y="172" class="ft-sans" font-size="15" fill="#8B8AA8">Open to meaningful collaborations — products, AI systems, and automation that earn their place.</text>

    <!-- right: signature block -->
    <rect x="936" y="72" width="216" height="76" rx="14" fill="#0B0716" fill-opacity="0.8" stroke="#8B5CF6" stroke-opacity="0.45"/>
    <text x="1044" y="100" text-anchor="middle" class="ft-mono" font-size="11" fill="#8B8AA8" letter-spacing="2">NEON AI WORKSHOP</text>
    <text x="1044" y="124" text-anchor="middle" class="ft-sans" font-size="15" font-weight="600" fill="#F5F3FF">Hilmi Salih Altınışık</text>
    <text x="1044" y="140" text-anchor="middle" class="ft-mono" font-size="10.5" fill="#22D3EE">@Salihefendihsa</text>
  </g>
</svg>
