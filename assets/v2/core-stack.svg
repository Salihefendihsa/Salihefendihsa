<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Core stack: C# / .NET, TypeScript, Python, React / Next.js, Flutter, Node.js, PostgreSQL, Docker, AI APIs, GitHub Actions.">
  <title>Core Stack</title>
  <defs>
    <linearGradient id="cs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07050F"/>
      <stop offset="0.55" stop-color="#0E0920"/>
      <stop offset="1" stop-color="#1A0F33"/>
    </linearGradient>
    <linearGradient id="cs-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241546" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#07050F" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cs-spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#E040FB"/>
    </linearGradient>
    <linearGradient id="cs-ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F1FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="cs-halo-v" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cs-halo-c" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cs-halo-m" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E040FB" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E040FB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cs-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#A78BFA" fill-opacity="0.16"/>
    </pattern>
    <filter id="cs-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cs-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cs-clip"><rect width="1200" height="400" rx="26"/></clipPath>

    <style>
      .cs-sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .cs-mono { font-family: Consolas, 'JetBrains Mono', Menlo, monospace; }
      .cs-pulse { animation: cs-pulse 3s ease-in-out infinite; }
      .cs-pulse2 { animation: cs-pulse 3s ease-in-out infinite; animation-delay: -1.5s; }
      .cs-float { animation: cs-float 6s ease-in-out infinite; }
      .cs-dash { stroke-dasharray: 6 10; animation: cs-dash 3.2s linear infinite; }
      .cs-blink { animation: cs-blink 5s steps(1, end) infinite; }
      @keyframes cs-pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes cs-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes cs-dash { to { stroke-dashoffset: -32; } }
      @keyframes cs-blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.12); } }

      @media (prefers-reduced-motion: reduce) { .cs-pulse, .cs-pulse2, .cs-float, .cs-dash, .cs-blink, .cs-anim { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#cs-clip)">
    <rect width="1200" height="400" fill="url(#cs-bg)"/>
    <rect width="1200" height="400" fill="url(#cs-dots)"/>
    <ellipse cx="600" cy="200" rx="560" ry="220" fill="url(#cs-halo-v)"/>
    <text x="600" y="56" text-anchor="middle" class="cs-mono" font-size="16" fill="#F5C451" letter-spacing="5">CORE STACK</text>
    <text x="600" y="88" text-anchor="middle" class="cs-sans" font-size="20" fill="#8E86B3">The tools I reach for when a product has to ship and keep running.</text>
    <g>
      <rect x="18" y="116" width="220" height="116" rx="20" fill="url(#cs-panel)" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.4"/>
      <rect x="40" y="138" width="30" height="4" rx="2" fill="#22D3EE"/>
      <text x="128" y="192" text-anchor="middle" class="cs-sans" font-size="30" font-weight="800" fill="#F4F1FF">C# / .NET</text>
    </g>
    <g>
      <rect x="254" y="116" width="220" height="116" rx="20" fill="url(#cs-panel)" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.4"/>
      <rect x="276" y="138" width="30" height="4" rx="2" fill="#22D3EE"/>
      <text x="364" y="192" text-anchor="middle" class="cs-sans" font-size="30" font-weight="800" fill="#F4F1FF">TypeScript</text>
    </g>
    <g>
      <rect x="490" y="116" width="220" height="116" rx="20" fill="url(#cs-panel)" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.4"/>
      <rect x="512" y="138" width="30" height="4" rx="2" fill="#22D3EE"/>
      <text x="600" y="192" text-anchor="middle" class="cs-sans" font-size="30" font-weight="800" fill="#F4F1FF">Python</text>
    </g>
    <g>
      <rect x="726" y="116" width="220" height="116" rx="20" fill="url(#cs-panel)" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.4"/>
      <rect x="748" y="138" width="30" height="4" rx="2" fill="#A78BFA"/>
      <text x="836" y="192" text-anchor="middle" class="cs-sans" font-size="26" font-weight="800" fill="#F4F1FF">React / Next.js</text>
    </g>
    <g>
      <rect x="962" y="116" width="220" height="116" rx="20" fill="url(#cs-panel)" stroke="#E040FB" stroke-opacity="0.55" stroke-width="1.4"/>
      <rect x="984" y="138" width="30" height="4" rx="2" fill="#E040FB"/>
      <text x="1072" y="192" text-anchor="middle" class="cs-sans" font-size="30" font-weight="800" fill="#F4F1FF">Flutter</text>
    </g>
    <g>
      <rect x="18" y="248" width="220" height="116" rx="20" fill="url(#cs-panel)" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.4"/>
      <rect x="40" y="270" width="30" height="4" rx="2" fill="#A78BFA"/>
      <text x="128" y="324" text-anchor="middle" class="cs-sans" font-size="30" font-weight="800" fill="#F4F1FF">Node.js</text>
    </g>
    <g>
      <rect x="254" y="248" width="220" height="116" rx="20" fill="url(#cs-panel)" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.4"/>
      <rect x="276" y="270" width="30" height="4" rx="2" fill="#A78BFA"/>
      <text x="364" y="324" text-anchor="middle" class="cs-sans" font-size="30" font-weight="800" fill="#F4F1FF">PostgreSQL</text>
    </g>
    <g>
      <rect x="490" y="248" width="220" height="116" rx="20" fill="url(#cs-panel)" stroke="#C9C2E8" stroke-opacity="0.55" stroke-width="1.4"/>
      <rect x="512" y="270" width="30" height="4" rx="2" fill="#C9C2E8"/>
      <text x="600" y="324" text-anchor="middle" class="cs-sans" font-size="30" font-weight="800" fill="#F4F1FF">Docker</text>
    </g>
    <g>
      <rect x="726" y="248" width="220" height="116" rx="20" fill="url(#cs-panel)" stroke="#F5C451" stroke-opacity="0.55" stroke-width="1.4"/>
      <rect x="748" y="270" width="30" height="4" rx="2" fill="#F5C451"/>
      <text x="836" y="324" text-anchor="middle" class="cs-sans" font-size="30" font-weight="800" fill="#F4F1FF">AI APIs</text>
    </g>
    <g>
      <rect x="962" y="248" width="220" height="116" rx="20" fill="url(#cs-panel)" stroke="#C9C2E8" stroke-opacity="0.55" stroke-width="1.4"/>
      <rect x="984" y="270" width="30" height="4" rx="2" fill="#C9C2E8"/>
      <text x="1072" y="324" text-anchor="middle" class="cs-sans" font-size="26" font-weight="800" fill="#F4F1FF">GitHub Actions</text>
    </g>
    <rect x="0" y="397" width="1200" height="3" fill="url(#cs-spectrum)" opacity="0.8"/>
  </g>
</svg>
