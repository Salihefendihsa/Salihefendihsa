<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="344" viewBox="0 0 1200 344" role="img" aria-label="Current signal — Building: AI-powered products and autonomous workflows. Learning: product strategy, sales and marketing. Open to: meaningful products, collaborations and ambitious ideas.">
  <title>Current Signal</title>
  <defs>
    <linearGradient id="sig-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07050F"/>
      <stop offset="0.55" stop-color="#0E0920"/>
      <stop offset="1" stop-color="#1A0F33"/>
    </linearGradient>
    <linearGradient id="sig-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241546" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#07050F" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="sig-spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#E040FB"/>
    </linearGradient>
    <linearGradient id="sig-ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F1FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="sig-halo-v" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sig-halo-c" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sig-halo-m" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E040FB" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E040FB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sig-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#A78BFA" fill-opacity="0.16"/>
    </pattern>
    <filter id="sig-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sig-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sig-clip"><rect width="1200" height="344" rx="26"/></clipPath>

    <style>
      .sig-sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .sig-mono { font-family: Consolas, 'JetBrains Mono', Menlo, monospace; }
      .sig-pulse { animation: sig-pulse 3s ease-in-out infinite; }
      .sig-pulse2 { animation: sig-pulse 3s ease-in-out infinite; animation-delay: -1.5s; }
      .sig-float { animation: sig-float 6s ease-in-out infinite; }
      .sig-dash { stroke-dasharray: 6 10; animation: sig-dash 3.2s linear infinite; }
      .sig-blink { animation: sig-blink 5s steps(1, end) infinite; }
      @keyframes sig-pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes sig-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes sig-dash { to { stroke-dashoffset: -32; } }
      @keyframes sig-blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.12); } }

      @media (prefers-reduced-motion: reduce) { .sig-pulse, .sig-pulse2, .sig-float, .sig-dash, .sig-blink, .sig-anim { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#sig-clip)">
    <rect width="1200" height="344" fill="url(#sig-bg)"/>
    <rect width="1200" height="344" fill="url(#sig-dots)"/>
    <ellipse cx="600" cy="160" rx="560" ry="200" fill="url(#sig-halo-v)"/>
    <rect x="24" y="24" width="1152" height="296" rx="24" fill="url(#sig-panel)" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1.2"/>
    <text x="64" y="72" class="sig-mono" font-size="16" fill="#F5C451" letter-spacing="5">CURRENT SIGNAL</text>
    <circle class="sig-pulse" cx="1120" cy="66" r="5" fill="#22D3EE" filter="url(#sig-glow)"/>
    <text x="1104" y="72" text-anchor="end" class="sig-mono" font-size="14" fill="#8E86B3" letter-spacing="3">LIVE</text>
    <line x1="64" y1="92" x2="1136" y2="92" stroke="#A78BFA" stroke-opacity="0.25"/>
    <circle class="sig-pulse" cx="72" cy="131" r="5" fill="#22D3EE" filter="url(#sig-glow)"/>
    <text x="92" y="140" class="sig-mono" font-size="18" font-weight="700" fill="#22D3EE" letter-spacing="4">BUILDING</text>
    <text x="300" y="140" class="sig-sans" font-size="28" font-weight="600" fill="#F4F1FF">AI-powered products and autonomous workflows</text>
    <line x1="64" y1="170" x2="1136" y2="170" stroke="#A78BFA" stroke-opacity="0.14"/>
    <circle cx="72" cy="199" r="5" fill="#A78BFA"/>
    <text x="92" y="208" class="sig-mono" font-size="18" font-weight="700" fill="#A78BFA" letter-spacing="4">LEARNING</text>
    <text x="300" y="208" class="sig-sans" font-size="28" font-weight="600" fill="#F4F1FF">Product strategy, sales and marketing</text>
    <line x1="64" y1="238" x2="1136" y2="238" stroke="#A78BFA" stroke-opacity="0.14"/>
    <circle cx="72" cy="267" r="5" fill="#F5C451"/>
    <text x="92" y="276" class="sig-mono" font-size="18" font-weight="700" fill="#F5C451" letter-spacing="4">OPEN TO</text>
    <text x="300" y="276" class="sig-sans" font-size="28" font-weight="600" fill="#F4F1FF">Meaningful products, collaborations and ambitious ideas</text>
  </g>
</svg>
