name: Update project index

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/generate_project_index.py
      - .github/workflows/update-project-index.yml

permissions:
  contents: write

concurrency:
  group: update-project-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Generate project index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_project_index.py

      - name: Verify only the generated block changed
        id: verify
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "README unchanged"
            exit 0
          fi
          python - <<'PY'
          import re, subprocess, sys
          pat = re.compile(r"<!-- PROJECT_INDEX:START -->.*?<!-- PROJECT_INDEX:END -->", re.S)
          before = subprocess.check_output(["git", "show", "HEAD:README.md"], text=True)
          after = open("README.md", encoding="utf-8").read()
          if not pat.search(before) or not pat.search(after):
              sys.exit("markers missing — refusing to commit")
          if pat.sub("", before) != pat.sub("", after):
              sys.exit("changes found outside the generated block — refusing to commit")
          PY
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.verify.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md generated/projects.md
          git commit -m "chore(profile): refresh project index [skip ci]"
          git push origin HEAD:main
