name: Update project index

# Refreshes the generated portfolio blocks in README.md from the public GitHub
# API and the public-safe product model in data/portfolio.json. Uses only the
# default GITHUB_TOKEN (public data); it never requests private repositories.
# Private and collaborative work is described solely from the committed,
# curated portfolio file — new private repositories are never published
# automatically. Featured products are curated, not chosen by the workflow.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/generate_portfolio.py
      - scripts/render_assets.py
      - data/portfolio.json
      - data/footprint.json
      - .github/workflows/update-project-index.yml
      # README.md and generated/ are deliberately absent: the workflow's own
      # commit must not re-trigger it (its commit message also carries [skip ci]).

permissions:
  contents: write

concurrency:
  group: update-project-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Generate portfolio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_portfolio.py

      - name: Verify only generated content changed
        id: verify
        run: |
          set -euo pipefail
          allowed="README.md generated/portfolio.md generated/project-archive.md assets/v5/proof-strip-dark.svg assets/v5/proof-strip-light.svg"
          changed="$(git status --porcelain | awk '{print $2}')"
          for f in $changed; do
            case " $allowed " in
              *" $f "*) ;;
              *) echo "unexpected change: $f"; exit 1 ;;
            esac
          done
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing to commit"
            exit 0
          fi
          python - <<'PY'
          import re, subprocess, sys
          pats = [re.compile(r"<!-- PORTFOLIO:START -->.*?<!-- PORTFOLIO:END -->", re.S),
                  re.compile(r"<!-- ARCHIVE:START -->.*?<!-- ARCHIVE:END -->", re.S)]
          before = subprocess.check_output(["git", "show", "HEAD:README.md"], text=True)
          after = open("README.md", encoding="utf-8").read()
          for pat in pats:
              if not pat.search(before) or not pat.search(after):
                  sys.exit("markers missing — refusing to commit")
              before, after = pat.sub("", before), pat.sub("", after)
          if before != after:
              sys.exit("changes found outside the generated blocks — refusing to commit")
          low = open("README.md", encoding="utf-8").read().lower()
          if "mrc-commerce" in low or "mrc commerce" in low:
              sys.exit("excluded repository would be published — refusing to commit")
          PY
          python -m unittest discover -s tests -p "test_readme_and_assets.py"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.verify.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md generated/portfolio.md generated/project-archive.md assets/v5/proof-strip-dark.svg assets/v5/proof-strip-light.svg
          git commit -m "chore(profile): refresh project index [skip ci]"
          git push origin HEAD:main
